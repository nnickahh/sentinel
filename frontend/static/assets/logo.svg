<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield -->
  <path d="M50 8 L85 24 V52 C85 74 50 92 50 92 C50 92 15 74 15 52 V24 L50 8 Z" 
        stroke="url(#shieldGrad)" stroke-width="4" fill="#0F172A" filter="url(#glow)"/>
  <!-- Inner Neural Eye / Cyber Ring -->
  <circle cx="50" cy="48" r="18" stroke="url(#aiGrad)" stroke-width="3" fill="#1E1B4B" />
  <circle cx="50" cy="48" r="9" fill="#10B981" filter="url(#glow)"/>
  <!-- Target Reticle Lines -->
  <line x1="50" y1="23" x2="50" y2="28" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="68" x2="50" y2="73" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <line x1="25" y1="48" x2="30" y2="48" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="48" x2="75" y2="48" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
</svg>
