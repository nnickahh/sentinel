<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberGuard AI</title>
  <style>
    body {
      margin: 0;
      width: 310px;
      padding: 16px;
      background: #0d1526;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e2d4a;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }
    .score-card {
      background: #131d33;
      border: 1px solid #1e2d4a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-val {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
    }
    .meta {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #0284c7);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">CyberGuard AI · Sentinel</div>
    <span class="badge" id="extStatus">LINKED</span>
  </div>
  <div class="score-card">
    <div>
      <div style="font-size:11px;color:#94a3b8;">PRIVACY SCORE</div>
      <div class="score-val" id="extScore">--/100</div>
    </div>
    <div class="meta" id="extCounts">
      Trackers: --<br>
      Blocked: --
    </div>
  </div>
  <a href="http://127.0.0.1:8765" target="_blank" class="btn">Open CyberGuard AI Dashboard</a>
  <script src="popup.js"></script>
</body>
</html>
